name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APEX_DATABASE_URL: postgresql+asyncpg://apex:apex@localhost:5432/apex_test
      APEX_TEST_DATABASE_URL: postgresql+asyncpg://apex:apex@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install uv==0.11.32
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests && .venv/bin/ruff format --check src tests
      - name: Type check (strict)
        run: .venv/bin/mypy src
      - name: Migrations up/down/up
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: Tests
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
